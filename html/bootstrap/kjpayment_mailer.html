<IF NAME="is_style_supported">

<div class="row justify-content-center">
    <div class="col-md-9 col-lg-7 col-xl-6">
        <div class="card shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex align-items-center gap-3 mb-4">
                    <span class="icon-box rounded-3 bg-primary-subtle text-primary-emphasis"><i class="fa-regular fa-envelope"></i></span>
                    <div class="overflow-hidden">
                        <h1 class="h4 fw-bold mb-1">{olang.KJP_MAIL_INFO_1}</h1>
                        <p class="text-body-secondary mb-0 text-break">{olang.KJP_FILE_NAME}: {fileName}</p>
                    </div>
                </div>

                <form action="{FormAction}" method="post">
                    {kjFormKeyPost}
                    <div class="mb-3">
                        <label for="kjp-buyer-mail" class="form-label">{olang.KJP_MAIL}</label>
                        <input type="email" name="buyerMail" class="form-control" id="kjp-buyer-mail" dir="ltr" aria-describedby="kjp-mail-help" autocomplete="email" required>
                        <div id="kjp-mail-help" class="form-text">{olang.KJP_MAIL_INFO_2}</div>
                    </div>

                    <button type="submit" name="sendMail" value="1" class="btn btn-primary px-4">
                        <i class="fa-regular fa-paper-plane me-2"></i>{lang.SUBMIT}
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<ELSE>
<p>{olang.KJP_STYLE_NOT_SUPPORTED}</p>
</IF>
